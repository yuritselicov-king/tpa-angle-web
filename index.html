<title>RUGGLI TPA — Angle Calculator</title>
<style>

  :root{
    --bg:#0c0d11;--panel:#15171d;--panel2:#1b1e26;--card:#101820;--border:#262a34;
    --accent:#5b9dff;--accent2:#ffb454;--ok:#4de8b2;--warn:#ffb454;--fail:#ff5d6c;
    --nw:#a78bfa;--text:#e7e9ee;--muted:#828896;--dim:#30343f;
    --base:#ff5d6c;--live:#5b9dff;
    --mono:'Space Mono',ui-monospace,monospace;--sans:'Space Grotesk',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body.lang-he{font-family:'Noto Sans Hebrew',var(--sans)}
  .mono{font-family:var(--mono)}
  html[dir="rtl"] .mono{direction:ltr;display:inline-block}
  .wrap{max-width:720px;margin:0 auto;min-height:100vh}
  .top{background:var(--panel);border-bottom:1px solid var(--border);padding:10px 14px;position:sticky;top:0;z-index:20}
  .toprow{display:flex;align-items:center;gap:10px}
  .brand{flex:1}
  .kick{font-family:var(--mono);font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  html[dir="rtl"] .kick{letter-spacing:normal}
  .h1{font-size:15px;font-weight:700}
  .lang-switch{display:flex;gap:5px}
  .lang-btn{font-family:var(--mono);font-size:10px;padding:5px 10px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer}
  .lang-btn.active{background:var(--accent);color:#06101f;border-color:var(--accent)}
  .conn{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;margin-top:6px;color:var(--muted)}
  .cdot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .cdot.live{background:var(--ok)} .cdot.local{background:var(--warn)}
  .tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:64px;z-index:19}
  .tab{flex:1;padding:11px 4px;border:none;background:transparent;cursor:pointer;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent)}
  .body{padding:12px 12px 60px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
  .card h3{font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:10px}
  html[dir="rtl"] .card h3{letter-spacing:normal}
  .field{margin-bottom:10px}
  .field label{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:4px}
  select,input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 10px;font-family:var(--sans);font-size:13px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;border:1.5px solid var(--accent);background:rgba(91,157,255,.14);color:var(--accent);font-family:var(--mono);font-size:11px;font-weight:700;padding:10px 12px;cursor:pointer;width:100%}
  .btn.ghost{border-color:var(--border);background:var(--panel2);color:var(--muted)}
  .btn.ok{border-color:var(--ok);background:rgba(77,232,178,.13);color:var(--ok)}
  .btn.warn{border-color:var(--accent2);background:rgba(255,180,84,.13);color:var(--accent2)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btnrow{display:flex;gap:8px;margin-bottom:10px}
  /* angle grid */
  .ahead,.arow{display:grid;grid-template-columns:20px 1fr 44px 44px 44px 44px 40px;gap:5px;align-items:center}
  .ahead{padding:4px 6px;position:sticky;top:0}
  .ahead span{font-family:var(--mono);font-size:8px;color:var(--muted);text-transform:uppercase;text-align:center}
  .ahead span.nm{text-align:start}
  .arow{padding:5px 6px;border-bottom:1px solid var(--border)}
  .arow .id{font-family:var(--mono);font-size:9px;color:var(--muted);text-align:center}
  .arow .nm{font-family:var(--mono);font-size:8.5px;font-weight:700;line-height:1.15}
  .arow .nm .cr{color:var(--fail)}
  .arow input{width:100%;text-align:center;padding:6px 2px;font-family:var(--mono);font-size:11px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px}
  .arow input.ref{color:var(--base);border-color:rgba(255,93,108,.3)}
  .arow input.live{color:var(--live);border-color:rgba(91,157,255,.3)}
  .arow input.live.lowc{border-color:#ffb454;background:rgba(255,180,84,.14);box-shadow:0 0 0 1px rgba(255,180,84,.45) inset}
  .arow input:read-only{opacity:.7;background:transparent;border-color:transparent}
  .dcell{font-family:var(--mono);font-size:9px;font-weight:700;text-align:center;border-radius:4px;padding:3px 0}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:9px;margin-top:8px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:4px}
  .dot{width:9px;height:9px;border-radius:2px;display:inline-block}
  .summ{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
  .stile{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px 4px;text-align:center}
  .stile .n{font-family:var(--mono);font-size:19px;font-weight:700}
  .stile .l{font-family:var(--mono);font-size:8px;color:var(--muted);text-transform:uppercase}
  .note{font-size:11px;color:var(--muted);line-height:1.55}
  .hint{font-size:10.5px;color:var(--muted);line-height:1.5;font-style:italic;margin-top:6px}
  textarea{width:100%;min-height:90px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px;font-family:var(--mono);font-size:11px;resize:vertical}
  .hist{border:1px solid var(--border);border-radius:9px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
  .hist .hh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
  .hist .who{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent)}
  .hist .when{font-family:var(--mono);font-size:9px;color:var(--muted)}
  .hist .badge{font-family:var(--mono);font-size:8px;font-weight:700;padding:2px 6px;border-radius:4px}
  .chg{font-family:var(--mono);font-size:10px;color:var(--muted);padding:2px 0}
  .chg b{color:var(--text)}
  .chg .from{color:var(--base)} .chg .to{color:var(--ok)}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);color:var(--text);padding:10px 16px;border-radius:10px;font-family:var(--mono);font-size:11px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
  .toast.show{opacity:1}
  .contract{font-family:var(--mono);font-size:9.5px;color:var(--muted);white-space:pre;overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;line-height:1.45}
  code{font-family:var(--mono);color:var(--accent2);font-size:11px}
  .file-in{display:none}
</style>
</head>

<!-- ============================================================
     SOFT LOGIN GATE
     This is a static site (GitHub Pages) with no backend, so this
     gate is a DETERRENT, not real security: the page source is
     public and can be read/bypassed by anyone with dev tools. The
     password is stored only as a SHA-256 hash (never plaintext).
     For genuine protection, put the site behind Cloudflare Access.
     ============================================================ -->
<style>
  body:not(.tpa-unlocked){overflow:hidden}
  body:not(.tpa-unlocked) .wrap{display:none !important}
  body.tpa-unlocked #tpa-gate{display:none}
  #tpa-gate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;
    background:#0c0d11;font-family:'Space Grotesk',system-ui,sans-serif;color:#e7e9ee;padding:20px}
  #tpa-gate .box{width:100%;max-width:340px;background:#15171d;border:1px solid #262a34;border-radius:14px;padding:28px}
  #tpa-gate h1{font-size:1.15rem;margin:0 0 4px;font-weight:600;letter-spacing:.02em}
  #tpa-gate .sub{margin:0 0 22px;color:#828896;font-size:.85rem}
  #tpa-gate label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:#828896;margin:0 0 6px}
  #tpa-gate input{width:100%;box-sizing:border-box;padding:11px 13px;margin-bottom:14px;background:#101820;
    border:1px solid #262a34;border-radius:9px;color:#e7e9ee;font-size:.95rem;font-family:inherit;outline:none}
  #tpa-gate input:focus{border-color:#5b9dff}
  #tpa-gate button{width:100%;padding:11px;background:#5b9dff;color:#0c0d11;border:none;border-radius:9px;
    font-weight:600;font-size:.95rem;cursor:pointer;font-family:inherit;margin-top:4px}
  #tpa-gate button:hover{opacity:.92}
  #tpa-gate .err{display:none;color:#ff5d6c;font-size:.82rem;margin:-2px 0 12px}
  #tpa-gate .err.show{display:block}
</style>
<div id="tpa-gate">
  <form class="box" onsubmit="return tpaLogin(event)" autocomplete="on">
    <h1>RUGGLI&nbsp;TPA</h1>
    <div class="sub">Please sign in to continue.</div>
    <label for="tpa-user">Username</label>
    <input id="tpa-user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label for="tpa-pass">Password</label>
    <input id="tpa-pass" type="password" autocomplete="current-password">
    <div class="err" id="tpa-err">Incorrect username or password.</div>
    <button type="submit">Sign in</button>
  </form>
</div>
<script>
(function(){
  var USER='root';
  // SHA-256 of the password. The plaintext is never stored in this file.
  var HASH='f722f6160d4f9d26206043d9d7b2c150c48c5e1280f7a71302b4d1cf29b71a45';
  // Compact SHA-256 (works in insecure contexts too, unlike crypto.subtle).
  function sha256(ascii){
    function rr(v,a){return(v>>>a)|(v<<(32-a));}
    var mp=Math.pow,mw=mp(2,32),L='length',i,j,result='';
    var words=[],bitLen=ascii[L]*8,hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k[L],comp={};
    for(var c=2;pc<64;c++){if(!comp[c]){for(i=0;i<313;i+=c){comp[i]=c;}hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0;}}
    ascii+='\x80';while(ascii[L]%64-56)ascii+='\x00';
    for(i=0;i<ascii[L];i++){j=ascii.charCodeAt(i);if(j>>8)return;words[i>>2]|=j<<((3-i)%4)*8;}
    words[words[L]]=((bitLen/mw)|0);words[words[L]]=(bitLen);
    for(j=0;j<words[L];){var w=words.slice(j,j+=16),oh=hash;hash=hash.slice(0,8);
      for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
        var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
        var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
        hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0;}
      for(i=0;i<8;i++){hash[i]=(hash[i]+oh[i])|0;}}
    for(i=0;i<8;i++){for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16);}}
    return result;
  }
  // Skip the gate if already signed in this browser session (no re-prompt on refresh).
  try{ if(sessionStorage.getItem('tpa_auth')==='1') document.body.classList.add('tpa-unlocked'); }catch(e){}
  window.tpaLogin=function(ev){
    ev.preventDefault();
    var u=(document.getElementById('tpa-user').value||'').trim();
    var p=document.getElementById('tpa-pass').value||'';
    if(u===USER && sha256(p)===HASH){
      try{ sessionStorage.setItem('tpa_auth','1'); }catch(e){}
      document.body.classList.add('tpa-unlocked');
    }else{
      document.getElementById('tpa-err').classList.add('show');
      document.getElementById('tpa-pass').value='';
      document.getElementById('tpa-pass').focus();
    }
    return false;
  };
  document.addEventListener('DOMContentLoaded',function(){
    if(document.body.classList.contains('tpa-unlocked'))return;
    var el=document.getElementById('tpa-user');if(el)el.focus();
  });
})();
</script>

const SEV_COLOR={match:"#4de8b2",tiny:"#5b9dff",minor:"#ffb454",major:"#ff5d6c"};

const LS='tpa_angle_calc_v1';
function loadStore(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return{}}}
function saveStore(s){try{localStorage.setItem(LS,JSON.stringify(s))}catch(e){}}
let store=loadStore();
// Built-in backend defaults so a fresh browser/phone is pre-connected. Not
// secret — the DB password and API key live only in n8n. Only empty fields are

};

store.refByLine=store.refByLine||{};

function refFor(ln){
  if(store.refByLine[ln]) return store.refByLine[ln];
  const r={}; ANGLES.forEach(a=>r[a.id]={on:a.base.on,off:a.base.off}); return r;
}
let ref=refFor(line);

// ═══════════ HELPERS ═══════════
const T=()=>i18n[currentLang];
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);}
function severity(d){return d>60?'major':d>15?'minor':d>0?'tiny':'match';}
function driftFor(id){
  const r=ref[id],l=live[id];
  const lon=l.on===''?null:+l.on, loff=l.off===''?null:+l.off;
  if(lon===null&&loff===null) return null;
  const dOn=lon===null?0:Math.abs(lon-r.on), dOff=loff===null?0:Math.abs(loff-r.off);
  const max=Math.max(dOn,dOff);
  return {dOn,dOff,max,sev:severity(max)};
}
function computeAll(){
  const out={}; let any=false;
  ANGLES.forEach(a=>{const d=driftFor(a.id); out[a.id]=d; if(d)any=true;});
  return any?out:null;
}

}
window.setLang=setLang;
function applyStatic(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(T()[k])el.textContent=T()[k];});

function angleGrid(){
  return `<div class="ahead">

function resultView(){
  const res=computeAll();
  if(!res) return `<div class="card"><div class="note">${T().res_none}</div></div>`;

  const counts={match:0,tiny:0,minor:0,major:0};
  ANGLES.forEach(a=>{if(res[a.id])counts[res[a.id].sev]++;});
  const overall= counts.major>0?['bad','overall_bad','#ff5d6c']: counts.minor>0?['warn','overall_warn','#ffb454']:['ok','overall_ok','#4de8b2'];
  const changes=diffVsLast();

     ${ANGLES.filter(a=>res[a.id]).sort((x,y)=>res[y.id].max-res[x.id].max).map(a=>{
        const d=res[a.id];const c=SEV_COLOR[d.sev];
        return `<div class="arow" style="grid-template-columns:20px 1fr 70px 70px 44px">

          <span class="mono" style="font-size:9px;color:var(--base);text-align:center">${ref[a.id].on}/${ref[a.id].off}</span>
          <span class="mono" style="font-size:9px;color:var(--live);text-align:center">${live[a.id].on||'–'}/${live[a.id].off||'–'}</span>

     ${changes===null?`<div class="note">${T().first_reading}</div>`:
       changes.length===0?`<div class="note">${T().no_changes}</div>`:

// ═══════════ ACTIONS ═══════════
function setEng(v){store.cfg.engineer=v;saveStore(store);updateConn();}
function setLine(v){line=+v;store.cfg.lastLine=line;ref=refFor(line);clearLiveSilent();saveStore(store);render();}
function setType(v){tType=v;store.cfg.lastType=v;saveStore(store);}
function setRef(id,f,v){ref[id][f]=+v||0;store.refByLine[line]=ref;saveStore(store);}
function setLive(id,f,v){
  live[id][f]=v.trim();
  // Engineer has reviewed/edited this field — clear any low-confidence flag on it.
  if(lowConf[id]&&lowConf[id][f]){lowConf[id][f]=false;document.getElementById((f==='on'?'lon':'loff')+id)?.classList.remove('lowc');}
  patchDelta(id);
}
function patchDelta(id){
  const cell=document.getElementById('d'+id); if(!cell)return;
  const d=driftFor(id);
  if(d){cell.textContent=d.max+'°';cell.style.color=SEV_COLOR[d.sev];cell.style.background=SEV_COLOR[d.sev]+'1c';}
  else{cell.textContent='–';cell.style.color='var(--dim)';cell.style.background='transparent';}
}
function clearLiveSilent(){ANGLES.forEach(a=>{live[a.id]={on:'',off:''};lowConf[a.id]={on:false,off:false};});}
function clearLive(){clearLiveSilent();render();}
function toggleRefEdit(){
  // Locking a manual edit commits the reference (records set_by + timestamp, posts for versioning).
  if(refEdit){commitRef('manual-edit');toast(T().ref_set_ok);}
  refEdit=!refEdit;render();
}
// Persist the current reference set for this line, stamp who/when/screen, and
// POST it for versioning into angle_references if a reference endpoint is set.
function commitRef(source,screen){
  store.refByLine[line]=ref;
  store.refMetaByLine[line]={set_by:store.cfg.engineer||'',ts:new Date().toISOString(),source:source,screen:screen};
  saveStore(store);
  postReference(source);
}
async function postReference(source){
  if(!store.cfg.urls.ref)return;
  try{
    await fetch(store.cfg.urls.ref,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        machine_type:"ruggli_tpa_angle",machine_serial:"8311",line:"L"+line,
        engineer_id:store.cfg.engineer,engineer_name:store.cfg.engineer,set_by:store.cfg.engineer||'',
        timestamp:new Date().toISOString(),source:source,reference_set:ref
      })});
  }catch(e){}
}
window.setEng=setEng;window.setLine=setLine;window.setType=setType;window.setRef=setRef;window.setLive=setLive;window.clearLive=clearLive;window.toggleRefEdit=toggleRefEdit;

function lastSaved(){const r=histFor(line);return r.length?r[0]:null;}
function diffVsLast(){
  const prev=lastSaved(); if(!prev||!prev.live) return null;
  const ch=[];
  ANGLES.forEach(a=>{
    const l=live[a.id], p=prev.live[a.id]||{on:null,off:null};
    ['on','off'].forEach(f=>{
      if(l[f]===''||l[f]==null) return;
      const nv=+l[f]; if(p[f]!=null && +p[f]!==nv) ch.push({angle:a.id,name:a.name,field:f,from:+p[f],to:nv});
    });
  });
  return ch;
}
function buildPayload(){
  const res=computeAll()||{};
  const drift={}; let major=0,minor=0; const flags=[];
  ANGLES.forEach(a=>{if(res[a.id]){drift[a.id]=res[a.id];if(res[a.id].sev==='major'){major++;flags.push({angle:a.id,name:a.name,delta:res[a.id].max});}if(res[a.id].sev==='minor')minor++;}});
  const changes=diffVsLast();
  const liveClean={}; ANGLES.forEach(a=>liveClean[a.id]={on:live[a.id].on===''?null:+live[a.id].on,off:live[a.id].off===''?null:+live[a.id].off});
  return {
    machine_type:"ruggli_tpa_angle", machine_serial:"8311", line:"L"+line,
    engineer_id:store.cfg.engineer, engineer_name:store.cfg.engineer,
    timestamp:new Date().toISOString(), tampon_type:tType, source:pendingLogs&&pendingLogs.src==='photo'?'photo':'manual',
    reference_set:ref, live:liveClean, drift,
    anomaly:{is_anomaly:major>0||minor>0,major,minor,flags},
    changes_since_previous:changes||[],
    logs:pendingLogs?{text:pendingLogs.text||'',attached:true}:{text:'',attached:false},
    image_ref:null, app_version:"1.0"
  };
}
async function saveReading(){
  if(!store.cfg.engineer){toast(T().need_eng);return;}
  const res=computeAll(); if(!res){toast(T().need_live);return;}
  const payload=buildPayload();
  payload.id='local-'+Date.now();
  // local cache first (always)
  store.readings.unshift(payload); saveStore(store);
  pendingLogs=null;
  if(store.cfg.urls.save){
    try{
      const r=await fetch(store.cfg.urls.save,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      if(r.ok){toast(T().saved_ok);} else {toast(T().saved_local);}
    }catch(e){toast(T().saved_local);}
  } else {toast(T().saved_local);}
  tab='history';document.querySelectorAll('.tab')[2].click();
}
window.saveReading=saveReading;

function histFor(ln){
  const key='L'+ln;
  return (store.readings||[]).filter(r=>r.line===key).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
}
async function loadHistory(){
  if(!store.cfg.urls.hist){histSource='local';render();return;}
  try{
    const r=await fetch(store.cfg.urls.hist+(store.cfg.urls.hist.includes('?')?'&':'?')+'line=L'+line);
    if(r.ok){const data=await r.json();const arr=Array.isArray(data)?data:(data.readings||[]);
      // merge backend into local cache (dedupe by id)
      const ids=new Set(store.readings.map(x=>x.id));
      arr.forEach(x=>{if(!ids.has(x.id))store.readings.push(x);});
      saveStore(store);histSource='backend';toast(T().test_ok);}
    else{histSource='local';toast(T().test_fail);}
  }catch(e){histSource='local';toast(T().test_fail);}
  render();
}
window.loadHistory=loadHistory;

// Resize + re-encode a phone photo to a bounded JPEG. Phone shots are large and
// often HEIC, which breaks the vision call; drawing to a canvas normalises them.
// Falls back to the raw file on any decode/encode error.
function imgToJpegB64(file,maxDim){
  return new Promise(resolve=>{
    const fallback=()=>fileB64(file).then(b64=>resolve({b64,mime:file.type}));
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      try{
        let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        const scale=Math.min(1,maxDim/Math.max(w,h));
        w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        const dataUrl=c.toDataURL('image/jpeg',0.85);
        URL.revokeObjectURL(url);
        resolve({b64:dataUrl.split(',')[1],mime:'image/jpeg'});
      }catch(e){URL.revokeObjectURL(url);fallback();}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);fallback();};
    img.src=url;
  });
}
// Batch 1–3 screen photos (angles 1–6, 7–12, 13–15) into ONE vision call.
async function extractAngles(files){
  const images=await Promise.all(files.map(async f=>{const {b64,mime}=await imgToJpegB64(f,1600);return {image_base64:b64,mime};}));
  const r=await fetch(store.cfg.urls.vision,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({machine_type:"ruggli_tpa_angle",line:"L"+line,images})});
  if(!r.ok)throw 0;
  return r.json();   // { angles:{ "3":{on,off,confidence}, ... }, screen, source }
}
// --- LIVE capture (blue ANGLE AT MACHINE screen) ---
function doPhoto(){
  if(!store.cfg.urls.vision){toast(T().photo_err);tab='settings';document.querySelectorAll('.tab')[3].click();return;}
  document.getElementById('photo-in').click();
}
window.doPhoto=doPhoto;
document.getElementById('photo-in').onchange=async function(){
  const files=[...this.files]; this.value=''; if(!files.length)return;
  toast(T().photo_wait);
  let data;
  try{ data=await extractAngles(files); }catch(e){ toast(T().vision_fail); return; }
  const ang=data.angles||data;
  let filled=0;
  ANGLES.forEach(a=>{
    const v=ang[a.id]||ang[String(a.id)]; if(!v)return;
    const low = v.confidence!=null && +v.confidence<0.6;
    if(v.on!=null){live[a.id].on=String(v.on);lowConf[a.id].on=low;filled++;}
    if(v.off!=null){live[a.id].off=String(v.off);lowConf[a.id].off=low;filled++;}
  });
  if(data.source!=='manual')pendingLogs=Object.assign(pendingLogs||{},{src:'photo'});
  toast(T().photo_ok+' ('+files.length+'→'+filled+'×)');
  render();
};
// --- REFERENCE capture (red BASE ANGLE screen) → writes the reference set ---
function doRefPhoto(){
  if(!store.cfg.urls.vision){toast(T().photo_err);tab='settings';document.querySelectorAll('.tab')[3].click();return;}
  if(!store.cfg.engineer){toast(T().need_eng);return;}
  document.getElementById('ref-photo-in').click();
}
window.doRefPhoto=doRefPhoto;
document.getElementById('ref-photo-in').onchange=async function(){
  const files=[...this.files]; this.value=''; if(!files.length)return;
  toast(T().photo_wait);
  let data;
  try{ data=await extractAngles(files); }catch(e){ toast(T().vision_fail); return; }
  const ang=data.angles||data;
  let filled=0;
  ANGLES.forEach(a=>{
    const v=ang[a.id]||ang[String(a.id)]; if(!v)return;
    if(v.on!=null){ref[a.id].on=+v.on||0;filled++;}
    if(v.off!=null){ref[a.id].off=+v.off||0;filled++;}
  });
  commitRef('photo',data.screen);   // persist refByLine + refMetaByLine, POST version if configured
  let msg=T().ref_set_ok+' ('+filled+'×)';
  if(data.screen!=='base') msg+=' · '+T().ref_note_notbase;
  toast(msg);
  render();
};
// Logs (separate button): attach text or file
function doLogs(){document.getElementById('logs-in').click();}
window.doLogs=doLogs;
document.getElementById('logs-in').onchange=async function(){
  const f=this.files[0]; if(!f)return;
  if(f.type.startsWith('image')){const b64=await fileB64(f);pendingLogs={text:'[image log attached]',image:b64,src:'logs-image'};}
  else{const txt=await f.text();pendingLogs={text:txt,src:'logs-text'};}
  toast(T().logs_attached);render();
  this.value='';
};

function fileB64(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.readAsDataURL(f);});}
function setUrl(k,v){store.cfg.urls[k]=v.trim();saveStore(store);updateConn();}
window.setUrl=setUrl;
async function testConn(){
  const u=store.cfg.urls.hist||store.cfg.urls.save;
  if(!u){toast(T().no_url);return;}
  try{const r=await fetch(u,{method:'GET'});toast(r.ok?T().test_ok:T().test_fail);}catch(e){toast(T().test_fail);}
}
window.testConn=testConn;
function exportAll(){
  const blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tpa_angle_history_'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
window.exportAll=exportAll;
function importAll(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);store=Object.assign(store,d);saveStore(store);toast('OK');render();}catch(e){toast('ERR');}};r.readAsText(f);}
window.importAll=importAll;

const CONTRACT=`POST {save}  →  Postgres INSERT (angle_readings)
{
  machine_type:"ruggli_tpa_angle", machine_serial:"8311",
  line:"L40", engineer_id, engineer_name, timestamp(ISO),
  tampon_type, source:"manual"|"photo",
  reference_set:{ "3":{on,off}, ... },
  live:{ "3":{on,off|null}, ... },
  drift:{ "3":{dOn,dOff,max,sev}, ... },
  anomaly:{ is_anomaly,major,minor,flags[] },
  changes_since_previous:[ {angle,field,from,to} ],
  logs:{ text, attached }, image_ref
}
GET  {hist}?line=L40  →  [ reading, ... ] (newest first)
POST {vision}  { machine_type, line, images:[{image_base64,mime},…] }
     →  { angles:{ "3":{on,off,confidence}, ... }, screen, source }
POST {ref}     →  angle_references (versioned BASE per line)
{ machine_type, machine_serial, line, set_by,
  engineer_id, engineer_name, timestamp(ISO),
  source:"photo"|"manual-edit", reference_set:{ "3":{on,off}, ... } }
POST {logs}    { text|image_base64 } → { parsed }`;

// init
applyStatic(); setLang(currentLang);
